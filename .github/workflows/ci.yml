name: CI

on:
  push:
    branches: [main, master, chore/docs-tests-ci]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Lint tracked PHP files
        run: find wp-content/themes/kallyas-child -name "*.php" -print0 | xargs -0 -n1 php -l
